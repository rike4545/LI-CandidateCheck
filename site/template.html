<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LI-CandidateCheck: fact checks of Long Island campaign websites</title>
<meta name="description" content="Source-by-source fact checks of the claims on Long Island state legislative candidates' campaign websites, using the same method and rating scale for every candidate.">
<style>
  :root {
    --bg: #f7f6f2; --fg: #1c1c1a; --muted: #62615a; --line: #dfddd5; --card: #fff; --chip: #eeede7;
    --accent: #1f4e79; --accent-fg: #fff; --hover: #f1f0ea;
    --r-ok: #2e7d4f; --r-cav: #c9a227; --r-over: #d9731c; --r-unv: #b9b8b1; --r-act: #3c78c8; --r-false: #c0392b;
    --p-d: #2a5ea8; --p-r: #b8382f; --queued: #e9e8e2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --fg: #ebeae5; --muted: #a5a49d; --line: #33322e; --card: #1d1d1b; --chip: #292926;
            --accent: #8db6df; --accent-fg: #10161d; --hover: #252523; --r-unv: #6e6d67; --queued: #2a2a27;
            --p-d: #6f9be0; --p-r: #e07a72; }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px 72px; }
  header.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
               backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  header.top .wrap { display: flex; align-items: center; gap: 18px; padding-top: 12px; padding-bottom: 12px; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 1.15rem; text-decoration: none; color: var(--fg); letter-spacing: -0.01em; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav a { text-decoration: none; color: var(--muted); padding: 6px 11px; border-radius: 8px; font-size: .95rem; }
  nav a[aria-current="page"] { background: var(--card); color: var(--fg); box-shadow: 0 0 0 1px var(--line) inset; }
  h1 { font-size: 1.75rem; margin: 28px 0 6px; letter-spacing: -0.015em; }
  h2 { font-size: 1.2rem; margin: 30px 0 10px; }
  h3 { font-size: .82rem; margin: 22px 0 8px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .lede { color: var(--muted); max-width: 72ch; margin: 0 0 8px; }
  .note { margin: 16px 0; padding: 11px 15px; border-left: 3px solid var(--accent); background: var(--card); color: var(--muted); font-size: .92rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 18px 0; }
  .kpi .v { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; }
  .kpi .l { color: var(--muted); font-size: .88rem; }
  .muted { color: var(--muted); }
  .small { font-size: .88rem; }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 1px 9px; font-size: .85rem; margin: 0 4px 4px 0; }
  .party { display: inline-block; min-width: 1.6em; text-align: center; border-radius: 5px; font-size: .78rem; font-weight: 700; padding: 0 5px; color: #fff; }
  .party.D { background: var(--p-d); } .party.R { background: var(--p-r); }
  .pill { font-size: .75rem; border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; color: var(--muted); margin-left: 6px; white-space: nowrap; }
  .pill.win { border-color: var(--r-ok); color: var(--r-ok); }
  /* stacked rating bar */
  .bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--queued); min-width: 80px; }
  .bar span { display: block; height: 100%; }
  .s-✅ { background: var(--r-ok); } .s-🟡 { background: var(--r-cav); } .s-🟠 { background: var(--r-over); }
  .s-⚪ { background: var(--r-unv); } .s-🔵 { background: var(--r-act); } .s-❌ { background: var(--r-false); }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .85rem; color: var(--muted); margin: 8px 0 4px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  /* filters */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0; }
  .filters select, .filters input { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; font-size: .93rem; }
  .filters input[type=search] { flex: 1 1 240px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--card); }
  .seg button { border: 0; background: none; padding: 6px 11px; cursor: pointer; font-size: .9rem; }

  .tile { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 10px 10px; cursor: pointer; position: relative; }
  .tile:hover { background: var(--hover); }

  .tile .flag { position: absolute; top: 9px; right: 9px; width: 10px; height: 10px; border-radius: 50%; }

  .tile .mini { display: flex; gap: 3px; }
  .tile .mini .bar { height: 6px; flex: 1; min-width: 0; }
  /* candidate rows / chart */

  table.rank th { text-align: left; color: var(--muted); font-weight: 500; font-size: .82rem; padding: 6px 8px; border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; white-space: nowrap; }
  table.rank td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.rank tr:hover td { background: var(--hover); }
  table.rank td.barcell { width: 38%; }
  table.rank td:first-child { white-space: nowrap; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  /* claims */
  .claim { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 9px;
           display: grid; grid-template-columns: 1.9rem 1fr; gap: 3px 10px; }
  .claim:target { box-shadow: 0 0 0 2px var(--accent); }
  .claim .r { font-size: 1.25rem; line-height: 1.25; grid-row: span 3; }
  .claim .c { font-weight: 600; }
  .claim .c small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .claim .s { font-size: .84rem; color: var(--muted); }
  .claim .s a { margin-right: 10px; }
  .claim .who { font-size: .82rem; color: var(--muted); }
  .empty { color: var(--muted); padding: 18px 0; }
  .head { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; justify-content: space-between; }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: .9rem; text-decoration: none; color: var(--fg); display: inline-block; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .side { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 760px) { .side { grid-template-columns: 1fr; } }
  .queued { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 18px; color: var(--muted); }
  ul.find { padding-left: 1.2em; margin: 8px 0; } ul.find li { margin-bottom: 6px; }
  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: .88rem; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>

<main class="wrap" id="app" tabindex="-1"></main>
<div class="wrap"><footer>
  Data, method and corrections: <a href="https://github.com/rike4545/LI-CandidateCheck">github.com/rike4545/LI-CandidateCheck</a>. Open an issue with a source.

/* ---------- state from URL ---------- */

    h("h1", {}, "2026 Long Island state legislative races"),

function viewRace(id) {

  const cs = r.candidates.map(x => C[x.slug]);
  const out = [h("p", {class: "small"}, link("#/", "← All races")),
    h("div", {class: "head"}, h("h1", {}, `${raceName(r)} (${r.id})`),

      (r.winner ? ` · Won by ${C[r.winner].name} (unofficial)` : " · Result: see the county board of elections"),
      r.result_source ? [" · ", h("a", {href: r.result_source, rel: "noopener", target: "_blank"}, "result source")] : null)];

    h("div", {}, R.filter(k => t[k]).map(k => h("span", {class: "chip"}, `${k} ${t[k]}`))),
    h("p", {}, c.bottom_line), link(`#/c/${c.slug}`, "Full review and every claim →"));
}

function viewCandidate(slug, claimId) {

        h("td", {class: "num"}, `${tb} (${pct(tb, cb)}%)`), h("td", {class: "barcell"}, mini(tb, cb)));
    }), h("tr", {}, h("td", {}, h("strong", {}, "Total")), h("td", {class: "num"}, h("strong", {}, ca.claims.length)), h("td"), h("td", {class: "num"}, h("strong", {}, cb.claims.length)), h("td")))));
  out.push(chart);
  const state = {rating: "flagged"};
  const seg = h("div", {class: "seg", role: "group", "aria-label": "Which claims"});
  const cols = h("div", {class: "side"});
  function draw() {
    seg.replaceChildren(...[["flagged", "🟡🟠❌ Problems"], ["all", "All"], ...R.map(k => [k, `${k} ${SHORT[k]}`])].map(([v, l]) =>
      h("button", {"aria-pressed": String(state.rating === v), onclick: () => { state.rating = v; draw(); }}, l)));
    const f = x => state.rating === "all" || (state.rating === "flagged" ? ["🟡", "🟠", "❌"].includes(x.rating) : x.rating === state.rating);
    cols.replaceChildren(...[ca, cb].map(c => {
      const rows = c.claims.filter(f);
      return h("div", {}, h("h2", {}, candLabel(c)), h("p", {class: "small muted"}, c.bottom_line),
        rows.length ? rows.map(x => claimCard(x, c)) : h("div", {class: "empty"}, "None in this category."));
    }));
  }
  out.push(h("h2", {}, "Claims side by side"), h("div", {class: "filters"}, seg), cols);
  draw();
  return out;
}

function viewDashboard(q) {
  const f = {chamber: q.get("chamber") || "", county: q.get("county") || "", party: q.get("party") || "", role: q.get("role") || ""};
  const sort = q.get("sort") || "race";
  const sel = (key, label, opts) => h("select", {"aria-label": label, onchange: e => { f[key] = e.target.value; setQuery("dashboard", {...f, sort}); render(); }},
    h("option", {value: ""}, `${label}: all`), opts.map(([v, l]) => h("option", {value: v, selected: f[key] === v ? true : null}, l)));
  const match = c => {
    const r = RACE[c.race];
    return (!f.chamber || r.chamber === f.chamber) && (!f.county || r.county.includes(f.county)) && (!f.party || c.party === f.party) &&
      (!f.role || (f.role === "incumbent" ? c.incumbent : f.role === "open" ? r.open_seat : !c.incumbent && !r.open_seat));
  };
  const all = Object.values(C).filter(match), rev = all.filter(c => c.status === "reviewed");
  const claims = rev.flatMap(c => c.claims), t = tally(claims);
  const out = [h("h1", {}, "Dashboard"),
    h("p", {class: "lede"}, "Ratings across every completed review. Filter to a slice, sort the table, then open any candidate."),
    h("div", {class: "filters"},
      sel("chamber", "Chamber", [["Senate", "Senate"], ["Assembly", "Assembly"]]),
      sel("county", "County", [["Suffolk", "Suffolk"], ["Nassau", "Nassau"]]),
      sel("party", "Party", [["D", "Democrat"], ["R", "Republican"]]),
      sel("role", "Role", [["incumbent", "Incumbent"], ["challenger", "Challenger"], ["open", "Open-seat candidate"]]),
      Object.values(f).some(Boolean) ? h("button", {class: "btn", onclick: () => { setQuery("dashboard", {}); render(); }}, "Clear") : null),
    h("div", {class: "kpis"},
      [[`${rev.length}/${all.length}`, "candidates reviewed"], [claims.length, "claims checked"],
       [claims.length ? `${Math.round(100 * (t["✅"] + t["🟡"]) / claims.length)}%` : "—", "verified (with or without caveat)"],
       [t["🟠"] + t["❌"], "overstated or false"], [t["⚪"], "no public record found"]]
        .map(([v, l]) => h("div", {class: "card kpi"}, h("div", {class: "v"}, v), h("div", {class: "l"}, l)))),
    h("div", {class: "card"}, h("strong", {}, "All claims in this slice"), h("div", {style: "margin:10px 0 4px"}, bar(claims, true)), legend())];
  if (f.party) out.push(h("p", {class: "note"}, "Party filters show which reviews exist. With few reviews, and pages of very different kinds, a party-level total says little about either party."));
  const cols = [["race", "Race"], ["name", "Candidate"], ["n", "Claims"], ["v", "Verified %"], ["p", "Problems"], ["u", "Unverified"]];
  const raceOrder = c => (c.race.startsWith("SD") ? 0 : 100) + Number(c.race.slice(2));
  const key = {race: raceOrder, name: c => c.name, n: c => -c.claims.length, v: c => -verifiedShare(c.claims),
    p: c => -c.claims.filter(x => ["🟠", "❌"].includes(x.rating)).length, u: c => -c.claims.filter(x => x.rating === "⚪").length};
  const rows = [...all].sort((x, y) => {
    const a = key[sort](x), b = key[sort](y);
    return a > b ? 1 : a < b ? -1 : raceOrder(x) - raceOrder(y);
  });
  out.push(h("h2", {}, "Candidates"), h("div", {class: "card", style: "overflow-x:auto"}, h("table", {class: "rank"},
    h("thead", {}, h("tr", {}, cols.map(([k, l]) => h("th", {class: ["n", "v", "p", "u"].includes(k) ? "num" : null, "aria-sort": sort === k ? "descending" : null,
      onclick: () => { setQuery("dashboard", {...f, sort: k}); render(); }}, l + (sort === k ? " ▾" : ""))), h("th", {}, "Ratings"))),
    h("tbody", {}, rows.map(c => h("tr", {}, h("td", {}, link(`#/race/${c.race}`, c.race)), h("td", {}, candLabel(c)),
      h("td", {class: "num"}, c.claims.length || "—"), h("td", {class: "num"}, c.claims.length ? `${Math.round(100 * verifiedShare(c.claims))}%` : "—"),
      h("td", {class: "num"}, c.claims.length ? c.claims.filter(x => ["🟠", "❌"].includes(x.rating)).length : "—"),
      h("td", {class: "num"}, c.claims.length ? c.claims.filter(x => x.rating === "⚪").length : "—"),
      h("td", {class: "barcell"}, c.status === "reviewed" ? bar(c.claims) : h("span", {class: "small muted"}, c.status === "queued" ? "not yet reviewed" : "no site found"))))))));
  return out;
}

function viewClaims(q) {
  const state = {q: q.get("q") || "", rating: q.get("rating") || "", cat: q.get("cat") || ""};
  const all = Object.values(C).filter(c => c.status === "reviewed").flatMap(c => c.claims.map(x => [x, c]));
  const box = h("div", {}), meta = h("p", {class: "small muted"});
  const input = h("input", {type: "search", value: state.q, placeholder: "Search every claim and finding (try “school aid”, “aquifer”, “grant”)…", "aria-label": "Search all claims",
    oninput: e => { state.q = e.target.value; draw(); }});
  const rsel = h("select", {"aria-label": "Rating", onchange: e => { state.rating = e.target.value; draw(); }},
    h("option", {value: ""}, "Any rating"), R.map(k => h("option", {value: k, selected: state.rating === k ? true : null}, `${k} ${RN[k]}`)));
  function draw() {
    setQuery("claims", {q: state.q, rating: state.rating});
    const ql = state.q.trim().toLowerCase();
    const rows = all.filter(([x, c]) => (!state.rating || x.rating === state.rating) &&
      (!ql || [x.claim, x.finding, x.pages, x.category, c.name, c.race].join(" ").toLowerCase().includes(ql)));
    meta.textContent = `${rows.length} of ${all.length} claims`;
    box.replaceChildren(...(rows.length ? rows.slice(0, 200).map(([x, c]) => claimCard(x, c, {who: true})) : [h("div", {class: "empty"}, "No claims match.")]));
    if (rows.length > 200) box.append(h("p", {class: "muted small"}, "Showing the first 200. Narrow the search to see the rest."));
  }
  draw();
  return [h("h1", {}, "Search every claim"), h("div", {class: "filters"}, input, rsel), meta, box];
}

function viewAbout() {
  return [h("h1", {}, "Method"),
    h("p", {class: "lede"}, "Every review follows the same steps and uses the same rating scale."),
    h("ol", {class: "find"},
      h("li", {}, "Inventory: every factual statement on the campaign pages in scope is extracted and deduplicated. Pure promises are not rated, but factual premises inside them are."),
      h("li", {}, "Sources, in order of weight: official records (bills, agency decisions, budget and tax data, election results), the candidate's own official materials, independent news, then advocacy sources as weak corroboration."),
      h("li", {}, "Rating: each claim is rated on whether the evidence supports it as worded on the page.")),
    h("h2", {}, "Ratings"), h("ul", {class: "find"}, R.map(k => h("li", {}, `${k} ${RN[k]}`))),
    h("p", {class: "note"}, "⚪ Unverified means no public record was found either way. It is not a finding that the claim is false. Pages differ a lot in length and type, so raw counts are not a like-for-like score of any candidate."),
    h("p", {}, D.results_note), h("p", {}, "Full method: ", link("https://github.com/rike4545/LI-CandidateCheck/blob/main/METHODOLOGY.md", "METHODOLOGY.md"), ".")];
}

/* ---------- router ---------- */
function render() {
  const {parts, q} = parse();
  const [v, a, b] = parts;
  const view = v === "race" ? viewRace(a) : v === "c" ? viewCandidate(a, b) : v === "compare" ? viewCompare(a, b)
    : v === "dashboard" ? viewDashboard(q) : v === "claims" ? viewClaims(q) : v === "about" ? viewAbout() : viewRaces(q);
  $app.replaceChildren(...[view].flat(9));
  const navKey = {race: "", c: "", compare: "compare", dashboard: "dashboard", claims: "claims", about: "about"}[v] ?? "";
  document.querySelectorAll("nav a").forEach(n => n.setAttribute("aria-current", n.getAttribute("href") === `#/${navKey}` ? "page" : "false"));
  const title = {race: a && `${a} race`, c: a && C[a] && C[a].name, compare: "Compare", dashboard: "Dashboard", claims: "Search claims", about: "Method"}[v];
  document.title = `${title ? title + " · " : ""}LI-CandidateCheck`;
}
let lastPath = "";
window.addEventListener("hashchange", () => {
  const p = location.hash.split("?")[0];
  render();
  if (p !== lastPath) { window.scrollTo(0, 0); lastPath = p; }
});
render();
</script>
</body>
