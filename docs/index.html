<title>LI-CandidateCheck: fact checks of Long Island campaign websites</title>

<style>
  :root {
    --bg: #f7f6f2; --fg: #1c1c1a; --muted: #62615a; --line: #dfddd5; --card: #fff; --chip: #eeede7;
    --accent: #1f4e79; --accent-fg: #fff; --hover: #f1f0ea;
    --r-ok: #2e7d4f; --r-cav: #c9a227; --r-over: #d9731c; --r-unv: #b9b8b1; --r-act: #3c78c8; --r-false: #c0392b;
    --p-d: #2a5ea8; --p-r: #b8382f; --queued: #e9e8e2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --fg: #ebeae5; --muted: #a5a49d; --line: #33322e; --card: #1d1d1b; --chip: #292926;
            --accent: #8db6df; --accent-fg: #10161d; --hover: #252523; --r-unv: #6e6d67; --queued: #2a2a27;
            --p-d: #6f9be0; --p-r: #e07a72; }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px 72px; }
  header.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
               backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  header.top .wrap { display: flex; align-items: center; gap: 18px; padding-top: 12px; padding-bottom: 12px; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 1.15rem; text-decoration: none; color: var(--fg); letter-spacing: -0.01em; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav a { text-decoration: none; color: var(--muted); padding: 6px 11px; border-radius: 8px; font-size: .95rem; }
  nav a[aria-current="page"] { background: var(--card); color: var(--fg); box-shadow: 0 0 0 1px var(--line) inset; }
  h1 { font-size: 1.75rem; margin: 28px 0 6px; letter-spacing: -0.015em; }
  h2 { font-size: 1.2rem; margin: 30px 0 10px; }
  h3 { font-size: .82rem; margin: 22px 0 8px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .lede { color: var(--muted); max-width: 72ch; margin: 0 0 8px; }
  .note { margin: 16px 0; padding: 11px 15px; border-left: 3px solid var(--accent); background: var(--card); color: var(--muted); font-size: .92rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 18px 0; }
  .kpi .v { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; }
  .kpi .l { color: var(--muted); font-size: .88rem; }
  .muted { color: var(--muted); }
  .small { font-size: .88rem; }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 1px 9px; font-size: .85rem; margin: 0 4px 4px 0; }
  .party { display: inline-block; min-width: 1.6em; text-align: center; border-radius: 5px; font-size: .78rem; font-weight: 700; padding: 0 5px; color: #fff; }
  .party.D { background: var(--p-d); } .party.R { background: var(--p-r); }
  .pill { font-size: .75rem; border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; color: var(--muted); margin-left: 6px; white-space: nowrap; }
  .pill.win { border-color: var(--r-ok); color: var(--r-ok); }
  /* stacked rating bar */
  .bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--queued); min-width: 80px; }
  .bar span { display: block; height: 100%; }
  .s-✅ { background: var(--r-ok); } .s-🟡 { background: var(--r-cav); } .s-🟠 { background: var(--r-over); }
  .s-⚪ { background: var(--r-unv); } .s-🔵 { background: var(--r-act); } .s-❌ { background: var(--r-false); }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .85rem; color: var(--muted); margin: 8px 0 4px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  /* filters */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0; }
  .filters select, .filters input { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; font-size: .93rem; }
  .filters input[type=search] { flex: 1 1 240px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--card); }
  .seg button { border: 0; background: none; padding: 6px 11px; cursor: pointer; font-size: .9rem; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  /* district grid */
  .county { margin-bottom: 18px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .tile { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 10px 10px; cursor: pointer; position: relative; }
  .tile:hover { background: var(--hover); }
  .tile .id { font-weight: 700; }
  .tile .who { font-size: .78rem; color: var(--muted); line-height: 1.3; margin: 3px 0 7px; min-height: 2.6em; }
  .tile .flag { position: absolute; top: 9px; right: 9px; width: 10px; height: 10px; border-radius: 50%; }
  .tile .flag.D { background: var(--p-d); } .tile .flag.R { background: var(--p-r); } .tile .flag.none { background: var(--line); }
  .tile .mini { display: flex; gap: 3px; }
  .tile .mini .bar { height: 6px; flex: 1; min-width: 0; }
  /* candidate rows / chart */
  table.rank { width: 100%; border-collapse: collapse; font-size: .93rem; }
  table.rank th { text-align: left; color: var(--muted); font-weight: 500; font-size: .82rem; padding: 6px 8px; border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; white-space: nowrap; }
  table.rank td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.rank tr:hover td { background: var(--hover); }
  table.rank td.barcell { width: 38%; }
  table.rank td:first-child { white-space: nowrap; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  /* claims */
  .claim { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 9px;
           display: grid; grid-template-columns: 1.9rem 1fr; gap: 3px 10px; }
  .claim:target { box-shadow: 0 0 0 2px var(--accent); }
  .claim .r { font-size: 1.25rem; line-height: 1.25; grid-row: span 3; }
  .claim .c { font-weight: 600; }
  .claim .c small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .claim .s { font-size: .84rem; color: var(--muted); }
  .claim .s a { margin-right: 10px; }
  .claim .who { font-size: .82rem; color: var(--muted); }
  .empty { color: var(--muted); padding: 18px 0; }
  .head { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; justify-content: space-between; }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: .9rem; text-decoration: none; color: var(--fg); display: inline-block; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .side { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 760px) { .side { grid-template-columns: 1fr; } }
  .queued { background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 18px; color: var(--muted); }
  ul.find { padding-left: 1.2em; margin: 8px 0; } ul.find li { margin-bottom: 6px; }
  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: .88rem; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>

rs.", "\"$10 back on every $1,000\" holds only for taxable purchases; groceries, prescriptions and most clothing are already exempt.", "Cap-and-invest is described as underway; it was drafted but never adopted, and the 2026 budget pushed the deadline to 2028.", "Three bio roles have no public trail: Autism Legal Foundation, NYCLU volunteer work, Mental Health Association of Nassau presidency.", "The Lloyd Aquifer case is accurate: the 2007 DEC denial is real and Murray was counsel of record, though the opponents were a coalition rather than one group."], "page_issues": ["Post-election headlines sit beside a \"Four weeks to go\" banner and a request to give \"before November 3.\"", "Several items are dated \"2926\" instead of 2026.", "The Home page calls him a CCE \"board leader\"; the About page says \"Chair.\"", "The site cites no filings, decisions or reports."], "follow_ups": ["Search the NYS Charities Bureau and IRS Tax Exempt Organization Search for an \"Autism Legal Foundation.\"", "Ask the campaign for the revenue estimate behind the 8% / $600,000 figure."], "depth": "full", "claims": [{"id": "B1", "category": "Biography", "pages": "Home; About", "claim": "Has practiced law for more than 30 years", "rating": "✅", "finding": "His Rivkin Radler profile says he has over 30 years of experience. He holds degrees from SUNY Albany and Georgetown Law and moved to Long Island in the early 1990s.", "sources": ["https://www.rivkinradler.com/attorneys/e-christopher-murray", "https://riverheadlocal.com/2026/11/10/meet-chris-murray-democrat-who-flipped-new-yorks-1st-senate-district/"]}, {"id": "B2", "category": "Biography", "pages": "About", "claim": "Partner at Rivkin Radler", "rating": "✅", "finding": "Listed as a partner on the firm's attorney page.", "sources": ["https://www.rivkinradler.com/attorneys/e-christopher-murray"]}, {"id": "B3", "category": "Biography", "pages": "About", "claim": "Practices environmental, civil rights, and commercial law", "rating": "✅", "finding": "His firm profile lists complex commercial work, including environmental and civil rights matters. Local press describes his practice as environmental law, real estate, and litigation.", "sources": ["https://www.rivkinradler.com/attorneys/e-christopher-murray", "https://www.27east.com/east-hampton-press/news/government/article_9200dc8f-0e48-4830-bac8-700edd1b1c44.html"]}, {"id": "B4", "category": "Biography", "pages": "Home", "claim": "Lives in Strongs Neck with his wife and four children", "rating": "✅", "finding": "RiverheadLOCAL reports he lives in Strong's Neck and has four children. 27east says Setauket; Strongs Neck is part of the Setauket area.", "sources": ["https://riverheadlocal.com/2026/11/10/meet-chris-murray-democrat-who-flipped-new-yorks-1st-senate-district/", "https://www.27east.com/east-hampton-press/news/government/article_9200dc8f-0e48-4830-bac8-700edd1b1c44.html"]}, {"id": "B5", "category": "Biography", "pages": "Home; About", "claim": "Chairs the Suffolk County Community College Board of Trustees", "rating": "🟡", "finding": "True in the past, but out of date. He chaired the board for several years (SUNY quoted him as chair in 2021), and 27east reports about 10 years on the board with five as chair. The college's current trustee list shows him as a trustee and Shirley Coverdale as chair. The site presents the title as current.", "sources": ["https://www.sunysuffolk.edu/about-suffolk/contacts-and-directories/board-of-trustees-and-sponsors.jsp", "https://www.suny.edu/suny-news/press-releases/4-21/4-26-21/", "https://www.27east.com/east-hampton-press/news/government/article_9200dc8f-0e48-4830-bac8-700edd1b1c44.html"]}, {"id": "B6", "category": "Biography", "pages": "Home; About", "claim": "Chair of the Board, Citizens Campaign for the Environment", "rating": "🟡", "finding": "He did chair this board. News coverage calls him the former chair, or says he has served as chair. The About page lists the title alongside current roles, while the Home page says only \"board leader.\" CCE's own board page could not be retrieved.", "sources": ["https://www.prismnews.com/local/suffolk-ny/environmental-attorney-chris-murray-enters-race-for", "https://riverheadlocal.com/2026/11/10/meet-chris-murray-democrat-who-flipped-new-yorks-1st-senate-district/"]}, {"id": "B7", "category": "Biography", "pages": "Home; About", "claim": "Founded the Autism Legal Foundation, which gives free legal help to adults on the autism spectrum", "rating": "⚪", "finding": "No registration, website, or press coverage found for an organization by this name. This is not a finding that the claim is false.", "sources": []}, {"id": "B8", "category": "Biography", "pages": "About", "claim": "Volunteer attorney for the New York Civil Liberties Union", "rating": "⚪", "finding": "No public record found either way. This kind of pro bono work is often not published.", "sources": []}, {"id": "B9", "category": "Biography", "pages": "About", "claim": "President, Nassau County Mental Health Association", "rating": "⚪", "finding": "The organization's legal name is the Mental Health Association of Nassau County. No record found of Murray as its president. The page gives no dates.", "sources": []}, {"id": "B10", "category": "Biography", "pages": "About", "claim": "President, Nassau Council of Chambers of Commerce", "rating": "🟡", "finding": "Confirmed for 2010, when he was a partner at Ruskin Moscou Faltischek. It is listed without dates next to current roles, so readers may take it as current.", "sources": ["https://www.franchising.com/news/20100302_nassau_council_of_chambers_of_commerce_hosts_nassa.html"]}, {"id": "R1", "category": "Record", "pages": "About; Priorities", "claim": "Represented an environmental group that successfully stopped a plan to drill a new well into the Lloyd Aquifer", "rating": "✅", "finding": "In October 2007 the DEC Commissioner denied the Suffolk County Water Authority's request for an exemption from the Lloyd Sands moratorium for its Middleville Road No. 3 well in Huntington. The ALJ had recommended approval. Murray, then at Reisman Peirez & Reisman, is on the decision's service list as counsel. The opposing parties were a coalition of about a dozen civic and environmental groups plus individuals, not a single group.", "sources": ["https://extapps.dec.ny.gov/docs/legal_protection_pdf/suffolk_county_decision.pdf", "https://extapps.dec.ny.gov/docs/legal_protection_pdf/suffolkcowaterir.pdf"]}, {"id": "R2", "category": "Record", "pages": "About", "claim": "Campaigned at train stations, downtown sidewalks, and front doors across the district", "rating": "🔵", "finding": "Campaign activity; can't be documented from public records.", "sources": []}, {"id": "E1", "category": "Election", "pages": "Home", "claim": "Flipped the 1st Senate District", "rating": "✅", "finding": "Unofficial election-night results had Murray ahead of incumbent Anthony Palumbo (R) by 4,064 votes with 213 of 214 election districts reporting. Palumbo congratulated him. Local press has since called him Senator-elect.", "sources": ["https://suffolktimes.timesreview.com/2026/11/electionliveblog/", "https://riverheadlocal.com/2026/11/10/meet-chris-murray-democrat-who-flipped-new-yorks-1st-senate-district/", "https://www.cityandstateny.com/politics/2026/11/where-do-all-key-new-york-state-legislative-races-stand/417054/"]}, {"id": "E2", "category": "Election", "pages": "Home", "claim": "Win ended a 112-year Republican hold on the district", "rating": "✅", "finding": "Press reports say Republicans had held the seat since 1914 (2026 − 1914 = 112). District lines and numbering have changed many times over that period.", "sources": ["https://riverheadlocal.com/2026/11/10/meet-chris-murray-democrat-who-flipped-new-yorks-1st-senate-district/"]}, {"id": "E3", "category": "Election", "pages": "Home; Priorities", "claim": "Democrats lead the State Senate and the district was represented by the minority party", "rating": "✅", "finding": "Democrats hold the Senate majority. Palumbo, the incumbent, is a Republican.", "sources": ["https://www.cityandstateny.com/politics/2026/11/where-do-all-key-new-york-state-legislative-races-stand/417054/"]}, {"id": "P1", "category": "Policy facts", "pages": "Priorities", "claim": "New York State's share of the sales tax is 4%", "rating": "✅", "finding": "The state rate is 4%. Counties and cities add their own rates on top of it. State sales and use tax collections were $20.27B in SFY 2025-26.", "sources": ["https://www.tax.ny.gov/research/collections/fy_collections_stat_report/2025-2026-annual-statistical-reports.htm"]}, {"id": "P2", "category": "Policy facts", "pages": "Priorities", "claim": "Cutting the state share to 3% means $10 back on every $1,000 you spend", "rating": "🟡", "finding": "The arithmetic is correct (1% of $1,000), but only for taxable purchases. Groceries, prescription drugs, and most clothing under $110 are already exempt, so a typical $1,000 of household spending returns less than $10.", "sources": []}, {"id": "P3", "category": "Policy facts", "pages": "Priorities", "claim": "New Yorkers would keep roughly $5.4 billion a year", "rating": "🟡", "finding": "Plausible, but the page shows no math. One point of a 4% tax is a quarter of collections. That is about $5.1B on SFY 2025-26 collections of $20.27B, and roughly $5.4B in SFY 2026-27 if collections keep growing about 6% a year.", "sources": ["https://www.tax.ny.gov/research/collections/fy_collections_stat_report/2025-2026-annual-statistical-reports.htm", "https://www.osc.ny.gov/press/releases/2026/04/dinapoli-state-tax-collections-exceeded-estimates-sfy-2025-26"]}, {"id": "P4", "category": "Policy facts", "pages": "Priorities", "claim": "Paid for by a 1% income tax increase on the top 8% of earners", "rating": "🟠", "finding": "The candidate's own descriptions conflict. In interviews he defined the group as people earning more than $600,000 (27east) and said the plan helps people earning under $600,000 (RiverheadLOCAL). Only about 1.7% of full-year resident filers have income of $500,000 or more (OSC, tax years 2015-19), so a $600,000 threshold covers far fewer than 8% of earners. The two versions would raise very different amounts, and no revenue estimate is published for either.", "sources": ["https://www.27east.com/east-hampton-press/news/government/article_9200dc8f-0e48-4830-bac8-700edd1b1c44.html", "https://riverheadlocal.com/2026/11/10/meet-chris-murray-democrat-who-flipped-new-yorks-1st-senate-district/", "https://www.osc.ny.gov/files/reports/pdf/taxpayer-migration.pdf"]}, {"id": "P5", "category": "Policy facts", "pages": "Priorities", "claim": "The New York Health Act is A1466 / S3425", "rating": "✅", "finding": "These are the correct 2025-26 bill numbers. Both bills were re-referred to their Health committees on January 7, 2026, and neither has passed a house.", "sources": ["https://www.nysenate.gov/legislation/bills/2025/S3425", "https://www.nysenate.gov/legislation/bills/2025/A1466"]}, {"id": "P6", "category": "Policy facts", "pages": "About; Priorities", "claim": "The Lloyd Aquifer is Long Island's deepest and oldest source of drinking water", "rating": "✅", "finding": "State law (ECL 15-1502) defines the Lloyd Sands as the deepest and oldest water-bearing layer of the Long Island aquifer system. New Lloyd wells are under a statutory moratorium (ECL 15-1528).", "sources": ["https://extapps.dec.ny.gov/docs/legal_protection_pdf/suffolk_county_decision.pdf", "https://nysenate.gov/legislation/laws/ENV/15-1528"]}, {"id": "P7", "category": "Policy facts", "pages": "Home; Priorities", "claim": "Long Island sits on a sole-source aquifer that supplies its drinking water", "rating": "✅", "finding": "EPA designated the Nassau/Suffolk aquifer system a sole source aquifer in 1978 (43 FR 26611).", "sources": ["https://webarchive.library.unt.edu/eot2008/20090511011432/http:/www.epa.gov/region2/water/aquifer"]}, {"id": "P8", "category": "Policy facts", "pages": "Priorities", "claim": "Today's data center moratoriums are temporary", "rating": "✅", "finding": "The Governor's July 2026 executive order pauses new hyperscale data centers and is lifted once state standards are final. The Legislature's bill would have imposed a one-year pause.", "sources": ["https://www.governor.ny.gov/news/long-island-governor-hochul-highlights-first-statewide-moratorium-new-hyperscale-data-centers", "https://www.nysenate.gov/newsroom/press-releases/2026/kristen-gonzalez/ny-state-senator-kristen-gonzalez-passes-data-center"]}, {"id": "P9", "category": "Policy facts", "pages": "Priorities", "claim": "Promises to keep \"implementing New York's cap-and-invest program\"", "rating": "🟡", "finding": "The wording implies a program already exists. It was drafted but never adopted. A court ordered DEC to issue emissions rules by February 6, 2026, and the 2026 budget then extended the deadline to 2028.", "sources": ["https://blogs.law.columbia.edu/climatechange/2025/11/20/to-implement-or-not-to-implement-new-york-state-climate-law-in-2025", "https://www.gtlaw.com/pl/insights/2026/5/new-york-budget-amends-the-states-climate-leadership-and-community-protection-act"]}, {"id": "P10", "category": "Policy facts", "pages": "Priorities", "claim": "ICE raids across the county and on the East End have damaged trust between residents and hurt local economies", "rating": "⚪", "finding": "A characterization; not tested against economic or survey data.", "sources": []}]}, "palumbo-anthony": {"slug": "palumbo-anthony", "name": "Anthony Palumbo", "party": "R", "status": "queued", "race": "SD1", "incumbent": true, "claims": []}, "singh-harjot": {"slug": "singh-harjot", "name": "Harjot Singh", "party": "D", "status": "queued", "race": "SD2", "incumbent": false, "claims": []}, "mattera-mario": {"slug": "mattera-mario", "name": "Mario Mattera", "party": "R", "status": "queued", "race": "SD2", "incumbent": true, "claims": []}, "vargas-ayala-antonio": {"slug": "vargas-ayala-antonio", i-fitzpatrick-patricia", "name": "Patricia Canzoneri-Fitzpatrick", "party": "R", "status": "queued", "race": "SD9", "incumbent": true, "claims": []}, "schiavoni-tommy-john": {"slug": "schiavoni-tommy-john", "name": "Tommy John Schiavoni", "party": "D", "status": "queued", "race": "AD1", "incumbent": true, "claims": []}, "kiely-stephen": {"slug": "kiely-stephen", "name": "Stephen Kiely", "party": "R", "status": "queued", "race": "AD1", "incumbent": false, "claims": []}, "szika-michael": {"slug": "szika-michael", "name": "Michael Szika", "party": "D", "status": "queued", "race": "AD2", "incumbent": false, "claims": []}, "giglio-jodi": {"slug": "giglio-jodi", "name": "Jodi Giglio", "party": "R", "status": "queued", "race": "AD2", "incumbent": true, "claims": []}, "slaughter-joshua": {"slug": "slaughter-joshua", "name": "Joshua Slaughter", "party": "D", "status": "queued", "race": "AD3", "incumbent": false, "claims": []}, "destefano-joe": {"slug": "destefano-joe", "name": "Joe DeStefano", "party": "R", "status": "queued", "race": "AD3", "incumbent": true, "claims": []}, "kassay-rebecca": {"slug": "kassay-rebecca", "name": "Rebecca Kassay", "party": "D", "race": "AD4", "incumbent": true, "status": "reviewed", "site": "https://www.kassayforassembly.com/rebecca-delivers", "site_label": "\"Rebecca Delivers\" page", "captured": "2026-10-24", "categories": ["Statewide", "Biography", "Legislation", "Funding", "State aid", "Volunteer events", "Constituent service", "Advocacy"], "where_label": "Tabs", "bottom_line": "The page is largely grounded in real, checkable events, and nothing tested was false. The problems are framing and precision, not fabrication.", "findings": ["Credit inflation on big numbers. The $6.5M Mill Pond Dam figure is the total state commitment; $2.75M was already committed by the Governor before Kassay's $3.75M budget add. Formula school aid (e.g., $282.7M for Longwood) is listed under \"Rebecca Delivers\" though it flows by statewide formula.", "One legislative claim overreaches. The cannabis bills Kassay introduced govern licensed retailers and local zoning input. The bill targeting illicit cannabis (A10698) was sponsored by another member; Kassay co-sponsored it.", "One volunteer number is higher than her own office reported: \"over 100 smoke detectors\" on the page vs. \"nearly 100\" in 74 homes in her office's release.", "Omitted outcome: the Port Jefferson–Rocky Point football advocacy is listed without noting the merger was denied and Port Jefferson fielded no varsity team in 2026.", "19 grant line items ($10K–$180K) have no public paper trail. Where one exists it sometimes shows less: Port Jefferson schools ($50K found vs. $130K claimed) and Comsewogue ($48K found vs. $96K claimed)."], "page_issues": ["Shared grants are repeated under up to six community tabs, so a reader tallying the page will double-count.", "The same grant is described differently in different tabs (Port Jefferson $130K; Three Village $150K).", "Two SCPD grants ($20K e-bike enforcement; $40K Behavioral Health Unit and e-bike enforcement) may describe the same money.", "Typo: \"CRP\" should be \"CPR\" (Three Village tab).", "None of the ~60 claims link to a bill, release, or budget document."], "follow_ups": ["FOIL the Assembly Ways and Means Committee for the AD4 legislative-initiative / SAM grant list for SFY 2025-26 and 2026-27.", "Pull NYSED enacted-budget school aid runs (BT2526, BT2627) for Longwood, Middle Country, Comsewogue, Port Jefferson and Three Village.", "Ask grant recipients to confirm receipt and amount."], "depth": "full", "claims": [{"id": "S1", "category": "Statewide", "pages": "Intro", "claim": "Helped lower middle-class income tax rates to their lowest since the 1950s", "rating": "🟡", "finding": "Supported by the state Division of the Budget: the FY2026 budget cuts middle-bracket rates (e.g. 5.5%→5.3% and 6%→5.8% by 2027 for joint filers), which DOB says are the lowest since 1959. Kassay's role is her budget vote. Cuts are 0.1–0.2 points; PolitiFact rated the Governor's related 'largest middle-class cut in 70 years' claim False.", "sources": ["https://politifact.com/factchecks/2025/jun/01/kathy-hochul/no-new-yorkers-are-not-getting-the-largest-middle/"]}, {"id": "S2", "category": "Statewide", "pages": "Intro", "claim": "Helped expand access to child care, pre-K, and free school meals", "rating": "🟡", "finding": "These were statewide budget initiatives led by the Governor; Kassay's role is her budget vote. Her office's 2025 mailer cites >$1B for universal pre-K.", "sources": ["https://assembly.ny.gov/write/upload/member_files/004/pdfs/20250626_0114512.pdf"]}, {"id": "S3", "category": "Statewide", "pages": "Intro", "claim": "Helped provide utility relief for working families", "rating": "⚪", "finding": "Statewide budget item; not independently checked against a specific program.", "sources": []}, {"id": "S4", "category": "Statewide", "pages": "Intro", "claim": "Helped address e-bikes, illegal cannabis sales, hate crimes, and auto insurance fraud", "rating": "⚪", "finding": "Statewide budget/legislative items; not individually traced. See L3 for her own cannabis bills.", "sources": []}, {"id": "S5", "category": "Biography", "pages": "Intro", "claim": "Small business owner and environmental educator", "rating": "✅", "finding": "Owner of the Fox and Owl Inn, Port Jefferson; former youth program director at Avalon Park & Preserve; environmental studies degree.", "sources": ["https://tbrnewsmedia.com/?p=171731"]}, {"id": "L1", "category": "Legislation", "pages": "Port Jefferson Village; Port Jefferson Station; Stony Brook; Strongs Neck; Terryville; Setauket; Belle Terre; Three Village", "claim": "Passed legislation to permanently preserve the Setauket–Port Jefferson Station Greenway", "rating": "✅", "finding": "A10341 (Kassay) / S10161 (Martinez, Palumbo). Signed July 6, 2026, Chapter 164. Grants a perpetual conservation easement and cleared the MTA's purchase of ~46 acres of the Lawrence Aviation site.", "sources": ["https://www.nysenate.gov/legislation/bills/2025/A10341", "https://www.assembly.ny.gov/mem/Rebecca-Kassay/story/119018"]}, {"id": "L2", "category": "Legislation", "pages": "Stony Brook; Setauket", "claim": "Passed legislation to facilitate collaboration between Stony Brook FD, Setauket FD, and Stony Brook University", "rating": "✅", "finding": "A8279 (Kassay) / S7889. Lets the two fire districts contract with SUNY Stony Brook for fire/EMS services. Passed Senate 62-0; signed Nov 21, 2025, Chapter 533.", "sources": ["https://www.nysenate.gov/legislation/bills/2025/A8279"]}, {"id": "L3", "category": "Legislation", "pages": "Coram", "claim": "Introduced illegal cannabis sale legislation to retain local government oversight and help stop illegal sales of intoxicating cannabis products", "rating": "🟠", "finding": "Partly. Kassay's own bills are A10088A (license applicants must attest to local zoning compliance — supports the 'local oversight' part) and A9282 (200-ft buffer from addiction treatment centers). Both govern LICENSED retailers and remain in committee. The bill that targets ILLICIT cannabis, A10698 (anti-inversion; passed both houses June 2026), is sponsored by Asm. Dais — Kassay is a co-sponsor, not the introducer.", "sources": ["https://www.nysenate.gov/legislation/bills/2025/A10088/amendment/A", "https://www.nysenate.gov/legislation/bills/2025/A9282", "https://www.nysenate.gov/legislation/bills/2025/A10698/amendment/original"]}, {"id": "L4", "category": "Legislation", "pages": "Port Jefferson Village; Port Jefferson Station; Stony Brook; Terryville; Setauket; Belle Terre; Three Village", "claim": "Championing efforts to electrify and modernize the Port Jefferson rail line for a one-seat ride", "rating": "🟡", "finding": "Supported as advocacy: she sponsored A8560A (2025, passed the Assembly) and the Greenway law that enabled the MTA's Sept 30, 2026 land purchase. Caveat: the state describes a rail yard as a future option only; no electrification funding or plan has been announced.", "sources": ["https://www.governor.ny.gov/news/governor-hochul-announces-mta-long-island-rail-road-acquires-portion-former-lawrence-aviation", "https://assembly.ny.gov/mem/Rebecca-Kassay/story/114525"]}, {"id": "F1", "category": "Funding", "pages": "Stony Brook; Setauket; Three Village", "claim": "$6.5 million for rebuilding the Mill Pond Dam and Harbor Road", "rating": "🟡", "finding": "$6.5M is the TOTAL state commitment. Governor had already committed $2.75M; Kassay is credited (by her own office) with adding $3.75M via the FY2026-27 budget's $20M Suffolk resiliency line. The Three Village tab phrases this accurately ('increased… to $6.5 million'); the Stony Brook and Setauket tabs imply she delivered the full amount. $2.5M federal funding also exists.", "sources": ["https://assembly.ny.gov/mem/Rebecca-Kassay/story/118376"]}, {"id": "F2", "category": "Funding", "pages": "Coram; Gordon Heights", "claim": "$2.2 million for a public playground, sport court and pavilion at Coram Elementary", "rating": "✅", "finding": "Announced Aug 10, 2026 with Speaker Heastie: $2,265,000. Page rounds down.", "sources": ["https://assembly.ny.gov/mem/Rebecca-Kassay/story/119278", "https://longisland.news12.com/2026/08/12/coram-elementary-school-fire-department-awarded-over-3m-in-state-funding/0qpza3J9jNCRnrTYHKGQO"]}, {"id": "F3", "category": "Funding", "pages": "Coram", "claim": "$800,000 to make Coram FD's community space ADA accessible", "rating": "✅", "finding": "Same Aug 2026 announcement: $800,000 for repairs/ADA and bathroom upgrades.", "sources": ["https://assembly.ny.gov/mem/Rebecca-Kassay/story/119278"]}, {"id": "F4", "category": "Funding", "pages": "Coram; Gordon Heights", "claim": "$144,000 for Longwood SD robotics, My Brother's/Sister's Keeper, enrichment", "rating": "✅", "finding": "Same release cites $144,000 in programmatic allocations and bullet aid to Longwood across FY2025 and FY2026.", "sources": ["https://assembly.ny.gov/mem/Rebecca-Kassay/story/119278"]}, {"id": "F5", "category": "Funding", "pages": "Port Jefferson Village", "claim": "$100,000 to the Village for the Caleb Brewster whaleboat boathouse", "rating": "✅", "finding": "Kassay release, May 11, 2026: $100,000 capital funding to the Village of Port Jefferson.", "sources": ["https://assembly.ny.gov/mem/Rebecca-Kassay/story/118114"]}, {"id": "F6", "category": "Funding", "pages": "Port Jefferson Station; Terryville", "claim": "$96,000 to Comsewogue SD for mentoring, school store, band camp, STEAM labs, life skills lab", "rating": "🟡", "finding": "Partly verified. Comsewogue's school board accepted a $48,000 legislative grant credited to Kassay on March 2, 2026 for the school store, band camp and tutoring (per an AI-generated summary of the board meeting). The page's $96,000 is consistent with two such grants, but a second award wasn't found. A supporter's Oct 22, 2026 TBR letter also says she secured over $100,000 for Comsewogue programs.", "sources": ["https://cpo.soar.com/articles/7592007/New-York/Board-accepts-48000-legislative-grant-to-fund-band-camp-school-store-and-tutoring", "https://tbrnewsmedia.com/letters-to-the-editor-oct-22-2026/"]}, {"id": "F7", "category": "Funding", "pages": "Port Jefferson Village; Belle Terre", "claim": "$130,000 to Port Jefferson SD for STEM and enrichment/environmental education", "rating": "🟠", "finding": "Only public report found: TBR (Sept 5, 2025) on $50,000 Kassay secured for STEM purchases at Port Jefferson schools (drones, coding kits, robotics). No record of the other $80,000 or of environmental-education funding. The two tabs also describe the grant's purpose differently.", "sources": ["https://tbrnewsmedia.com/assemblywoman-kassay-secures-50k-state-funding-for-stem-at-pj-schools/"]}, {"id": "F8", "category": "Funding", "pages": "Port Jefferson Village; Belle Terre", "claim": "$65,000 to Port Jefferson Fire District for a flood mitigation study", "rating": "🟡", "finding": gs Neck; Old Field; Poquott; Setauket; Three Village", "claim": "$150,000 to Three Village SD for summer reading and enrichment", "rating": "⚪", "finding": "No Kassay grant found. In April 2025 the Three Village school board restored summer reading (~$70,000 estimated) from internal savings, not a state grant.", "sources": ["https://tbrnewsmedia.com/three-village-school-board-discusses-security-program-funding-and-autism-awareness/"]}, {"id": "F17", "category": "Funding", "pages": "Strongs Neck; Old Field; Poquott; Setauket; Three Village", "claim": "$100,000 to Setauket FD for a high-water rescue vehicle", "rating": "⚪", "finding": "No public record found.", "sources": []}, {"id": "F18", "category": "Funding", "pages": "Stony Brook; Old Field; Setauket; Three Village", "claim": "$180,000 to the Three Village Historical Society", "rating": "⚪", "finding": "No public record found.", "sources": []}, {"id": "F19", "category": "Funding", "pages": "Stony Brook; Old Field; Setauket; Three Village", "claim": "$100,000 to the Three Village Community Trust", "rating": "⚪", "finding": "No public record found.", "sources": []}, {"id": "F20", "category": "Funding", "pages": "Old Field; Three Village", "claim": "$100,000 to restore the Old Field Lighthouse", "rating": "⚪", "finding": "No 2025-26 record found (prior state funding came via Sen. Flanagan in 2018).", "sources": ["https://www.nysenate.gov/newsroom/press-releases/2018/john-j-flanagan/senator-flanagan-secures-funding-old-field-lighthouse"]}, {"id": "F21", "category": "Funding", "pages": "Stony Brook; Three Village", "claim": "$100,000 to the Reboli Center", "rating": "⚪", "finding": "No public record found.", "sources": []}, {"id": "F22", "category": "Funding", "pages": "Stony Brook; Three Village", "claim": "$25,000 to the Long Island Museum for fee-free events", "rating": "⚪", "finding": "No public record found.", "sources": []}, {"id": "F23", "category": "Funding", "pages": "Strongs Neck; Old Field; Poquott; Setauket; Three Village", "claim": "$10,000 to the Setauket Harbor Task Force", "rating": "⚪", "finding": "No public record found.", "sources": []}, {"id": "F24", "category": "Funding", "pages": "Gordon Heights", "claim": "$100,000 to Gordon Heights FD for facility upgrades", "rating": "⚪", "finding": "No public record found.", "sources": []}, {"id": "F25", "category": "Funding", "pages": "Gordon Heights", "claim": "$10,000 to Gordon Heights Civic Association for the 100th Gordon Heights Day", "rating": "⚪", "finding": "Amount not found. Timing checks out: the 90th annual Gordon Heights Family Day was in 2017, so the 100th falls in 2027 ('next year').", "sources": ["https://nysenate.gov/legislation/resolutions/2017/2017-j2449"]}, {"id": "F26", "category": "Funding", "pages": "Selden", "claim": "$100,000 to Middle Country SD for security and auditorium tech", "rating": "⚪", "finding": "No public record found.", "sources": []}, {"id": "F27", "category": "Funding", "pages": "Selden", "claim": "$30,000 for Middle Country SD's Northwell mental-health partnership", "rating": "⚪", "finding": "No public record found.", "sources": []}, {"id": "A1", "category": "State aid", "pages": "Coram; Gordon Heights", "claim": "$282,732,669 total state aid to Longwood SD FY25-27", "rating": "🟡", "finding": "Exact figure not matched (NYSED run site unreachable). Magnitude is plausible for two school years. Caveat: formula aid set statewide, not 'delivered' by one member; Longwood is only partly in AD4.", "sources": []}, {"id": "A2", "category": "State aid", "pages": "Selden", "claim": "$262,298,849 total state aid to Middle Country SD FY25-27", "rating": "🟡", "finding": "Exact figure not matched. Plausible: district reported ~$120M for 2024-25, so ~$131M/yr average is consistent. Same attribution caveat; Middle Country is only partly in AD4.", "sources": ["https://tbrnewsmedia.com/?p=169719"]}, {"id": "A3", "category": "State aid", "pages": "Port Jefferson Village; Belle Terre", "claim": "$8,54 y.gov/mem/Rebecca-Kassay/press/"]}, {"id": "E4", "category": "Volunteer events", "pages": "Coram; Gordon Heights; Strongs Neck; Setauket; Three Village", "claim": "September mission: American chestnut trees planted at multiple historic sites", "rating": "✅", "finding": "Release: Monthly Mission series launched with a district-wide American chestnut planting.", "sources": ["https://assembly.ny.gov/mem/Rebecca-Kassay/press/"]}, {"id": "E5", "category": "Volunteer events", "pages": "Coram", "claim": "February mission: Valentines for healthcare workers and diabetes screenings at Coram firehouse", "rating": "✅", "finding": "Feb 12, 2026 at Coram Fire Department; free A1C diabetes screenings by Sun River Health and Cornell Cooperative Extension; ~230 cards made.", "sources": ["https://www.longisland.com/news/02-03-26/volunteers-invited-to-make-valentines-for-healthcare-workers-at-coram-fire-department-plus-free-diabetes-screenings-and-resources.html", "https://assembly.ny.gov/mem/Rebecca-Kassay/story/116981"]}, {"id": "E6", "category": "Volunteer events", "pages": "Three Village", "claim": "Handcrafted remembrance poppies at the LI State Veterans Home", "rating": "✅", "finding": "Release May 4, 2026 (event April 25).", "sources": ["https://www.assembly.ny.gov/mem/Rebecca-Kassay/newsroom"]}, {"id": "E7", "category": "Volunteer events", "pages": "Port Jefferson Village; Belle Terre", "claim": "August mission: back-to-school pajama packages with EJ's PJs", "rating": "✅", "finding": "Announced July 27, 2026.", "sources": ["https://www.longisland.com/news/07-27-26/assemblywoman-kassays-august-monthly-mission-back-to-school-pajama-packages-with-ejs-pjs.html"]}, {"id": "E8", "category": "Volunteer events", "pages": "Port Jefferson Station; Terryville; Three Village", "claim": "July mission: Greenway Trail cleanup with Friends of the Greenway", "rating": "✅", "finding": "July 18, 2026 cleanup of the 3.4-mile Greenway Trail with Friends of the Greenway and the Three Village Commun   const chart = h("div", {class: "card"}, h("table", {class: "rank"}, h("thead", {}, h("tr", {}, h("th", {}, "Rating"), h("th", {class: "num"}, ca.name), h("th", {}, ""), h("th", {class: "num"}, cb.name), h("th", {}, ""))),
    h("tbody", {}, R.map(k => {
      const ta = tally(ca.claims)[k], tb = tally(cb.claims)[k];
      const pct = (n, c) => c.claims.length ? Math.round(100 * n / c.claims.length) : 0;
      const mini = (n, c) => h("div", {class: "bar", style: "background:transparent"}, h("span", {class: `s-${k}`, style: `width:${pct(n, c)}%`}));
      return h("tr", {}, h("td", {}, `${k} ${RN[k]}`), h("td", {class: "num"}, `${ta} (${pct(ta, ca)}%)`), h("td", {class: "barcell"}, mini(ta, ca)),
        h("td", {class: "num"}, `${tb} (${pct(tb, cb)}%)`), h("td", {class: "barcell"}, mini(tb, cb)));
    }), h("tr", {}, h("td", {}, h("strong", {}, "Total")), h("td", {class: "num"}, h("strong", {}, ca.claims.length)), h("td"), h("td", {class: "num"}, h("strong", {}, cb.claims.length)), h("td")))));
  out.push(chart);
  const state = {rating: "flagged"};
  const seg = h("div", {class: "seg", role: "group", "aria-label": "Which claims"});
  const cols = h("div", {class: "side"});
  function draw() {
    seg.replaceChildren(...[["flagged", "🟡🟠❌ Problems"], ["all", "All"], ...R.map(k => [k, `${k} ${SHORT[k]}`])].map(([v, l]) =>
      h("button", {"aria-pressed": String(state.rating === v), onclick: () => { state.rating = v; draw(); }}, l)));
    const f = x => state.rating === "all" || (state.rating === "flagged" ? ["🟡", "🟠", "❌"].includes(x.rating) : x.rating === state.rating);
    cols.replaceChildren(...[ca, cb].map(c => {
      const rows = c.claims.filter(f);
      return h("div", {}, h("h2", {}, candLabel(c)), h("p", {class: "small muted"}, c.bottom_line),
        rows.length ? rows.map(x => claimCard(x, c)) : h("div", {class: "empty"}, "None in this category."));
    }));
  }
  out.push(h("h2", {}, "Claims side by side"), h("div", {class: "filters"}, seg), cols);
  draw();
  return out;
}

function viewDashboard(q) {
  const f = {chamber: q.get("chamber") || "", county: q.get("county") || "", party: q.get("party") || "", role: q.get("role") || ""};
  const sort = q.get("sort") || "race";
  const sel = (key, label, opts) => h("select", {"aria-label": label, onchange: e => { f[key] = e.target.value; setQuery("dashboard", {...f, sort}); render(); }},
    h("option", {value: ""}, `${label}: all`), opts.map(([v, l]) => h("option", {value: v, selected: f[key] === v ? true : null}, l)));
  const match = c => {
    const r = RACE[c.race];
    return (!f.chamber || r.chamber === f.chamber) && (!f.county || r.county.includes(f.county)) && (!f.party || c.party === f.party) &&
      (!f.role || (f.role === "incumbent" ? c.incumbent : f.role === "open" ? r.open_seat : !c.incumbent && !r.open_seat));
  };
  const all = Object.values(C).filter(match), rev = all.filter(c => c.status === "reviewed");
  const claims = rev.flatMap(c => c.claims), t = tally(claims);
  const out = [h("h1", {}, "Dashboard"),
    h("p", {class: "lede"}, "Ratings across every completed review. Filter to a slice, sort the table, then open any candidate."),
    h("div", {class: "filters"},
      sel("chamber", "Chamber", [["Senate", "Senate"], ["Assembly", "Assembly"]]),
      sel("county", "County", [["Suffolk", "Suffolk"], ["Nassau", "Nassau"]]),
      sel("party", "Party", [["D", "Democrat"], ["R", "Republican"]]),
      sel("role", "Role", [["incumbent", "Incumbent"], ["challenger", "Challenger"], ["open", "Open-seat candidate"]]),
      Object.values(f).some(Boolean) ? h("button", {class: "btn", onclick: () => { setQuery("dashboard", {}); render(); }}, "Clear") : null),
    h("div", {class: "kpis"},
      [[`${rev.length}/${all.length}`, "candidates reviewed"], [claims.length, "claims checked"],
       [claims.length ? `${Math.round(100 * (t["✅"] + t["🟡"]) / claims.length)}%` : "—", "verified (with or without caveat)"],
       [t["🟠"] + t["❌"], "overstated or false"], [t["⚪"], "no public record found"]]
        .map(([v, l]) => h("div", {class: "card kpi"}, h("div", {class: "v"}, v), h("div", {class: "l"}, l)))),
    h("div", {class: "card"}, h("strong", {}, "All claims in this slice"), h("div", {style: "margin:10px 0 4px"}, bar(claims, true)), legend())];
  if (f.party) out.push(h("p", {class: "note"}, "Party filters show which reviews exist. With few reviews, and pages of very different kinds, a party-level total says little about either party."));
  const cols = [["race", "Race"], ["name", "Candidate"], ["n", "Claims"], ["v", "Verified %"], ["p", "Problems"], ["u", "Unverified"]];
  const raceOrder = c => (c.race.startsWith("SD") ? 0 : 100) + Number(c.race.slice(2));
  const key = {race: raceOrder, name: c => c.name, n: c => -c.claims.length, v: c => -verifiedShare(c.claims),
    p: c => -c.claims.filter(x => ["🟠", "❌"].includes(x.rating)).length, u: c => -c.claims.filter(x => x.rating === "⚪").length};
  const rows = [...all].sort((x, y) => {
    const a = key[sort](x), b = key[sort](y);
    return a > b ? 1 : a < b ? -1 : raceOrder(x) - raceOrder(y);
  });
  out.push(h("h2", {}, "Candidates"), h("div", {class: "card", style: "overflow-x:auto"}, h("table", {class: "rank"},
    h("thead", {}, h("tr", {}, cols.map(([k, l]) => h("th", {class: ["n", "v", "p", "u"].includes(k) ? "num" : null, "aria-sort": sort === k ? "descending" : null,
      onclick: () => { setQuery("dashboard", {...f, sort: k}); render(); }}, l + (sort === k ? " ▾" : ""))), h("th", {}, "Ratings"))),
    h("tbody", {}, rows.map(c => h("tr", {}, h("td", {}, link(`#/race/${c.race}`, c.race)), h("td", {}, candLabel(c)),
      h("td", {class: "num"}, c.claims.length || "—"), h("td", {class: "num"}, c.claims.length ? `${Math.round(100 * verifiedShare(c.claims))}%` : "—"),
      h("td", {class: "num"}, c.claims.length ? c.claims.filter(x => ["🟠", "❌"].includes(x.rating)).length : "—"),
      h("td", {class: "num"}, c.claims.length ? c.claims.filter(x => x.rating === "⚪").length : "—"),
      h("td", {class: "barcell"}, c.status === "reviewed" ? bar(c.claims) : h("span", {class: "small muted"}, c.status === "queued" ? "not yet reviewed" : "no site found"))))))));
  return out;
}

function viewClaims(q) {
  const state = {q: q.get("q") || "", rating: q.get("rating") || "", cat: q.get("cat") || ""};
  const all = Object.values(C).filter(c => c.status === "reviewed").flatMap(c => c.claims.map(x => [x, c]));
  const box = h("div", {}), meta = h("p", {class: "small muted"});
  const input = h("input", {type: "search", value: state.q, placeholder: "Search every claim and finding (try “school aid”, “aquifer”, “grant”)…", "aria-label": "Search all claims",
    oninput: e => { state.q = e.target.value; draw(); }});
  const rsel = h("select", {"aria-label": "Rating", onchange: e => { state.rating = e.target.value; draw(); }},
    h("option", {value: ""}, "Any rating"), R.map(k => h("option", {value: k, selected: state.rating === k ? true : null}, `${k} ${RN[k]}`)));
  function draw() {
    setQuery("claims", {q: state.q, rating: state.rating});
    const ql = state.q.trim().toLowerCase();
    const rows = all.filter(([x, c]) => (!state.rating || x.rating === state.rating) &&
      (!ql || [x.claim, x.finding, x.pages, x.category, c.name, c.race].join(" ").toLowerCase().includes(ql)));
    meta.textContent = `${rows.length} of ${all.length} claims`;
    box.replaceChildren(...(rows.length ? rows.slice(0, 200).map(([x, c]) => claimCard(x, c, {who: true})) : [h("div", {class: "empty"}, "No claims match.")]));
    if (rows.length > 200) box.append(h("p", {class: "muted small"}, "Showing the first 200. Narrow the search to see the rest."));
  }
  draw();
  return [h("h1", {}, "Search every claim"), h("div", {class: "filters"}, input, rsel), meta, box];
}

function viewAbout() {
  return [h("h1", {}, "Method"),
    h("p", {class: "lede"}, "Every review follows the same steps and uses the same rating scale."),
    h("ol", {class: "find"},
      h("li", {}, "Inventory: every factual statement on the campaign pages in scope is extracted and deduplicated. Pure promises are not rated, but factual premises inside them are."),
      h("li", {}, "Sources, in order of weight: official records (bills, agency decisions, budget and tax data, election results), the candidate's own official materials, independent news, then advocacy sources as weak corroboration."),
      h("li", {}, "Rating: each claim is rated on whether the evidence supports it as worded on the page.")),
    h("h2", {}, "Ratings"), h("ul", {class: "find"}, R.map(k => h("li", {}, `${k} ${RN[k]}`))),
    h("p", {class: "note"}, "⚪ Unverified means no public record was found either way. It is not a finding that the claim is false. Pages differ a lot in length and type, so raw counts are not a like-for-like score of any candidate."),
    h("p", {}, D.results_note), h("p", {}, "Full method: ", link("https://github.com/rike4545/LI-CandidateCheck/blob/main/METHODOLOGY.md", "METHODOLOGY.md"), ".")];
}

/* ---------- router ---------- */
function render() {
  const {parts, q} = parse();
  const [v, a, b] = parts;
  const view = v === "race" ? viewRace(a) : v === "c" ? viewCandidate(a, b) : v === "compare" ? viewCompare(a, b)
    : v === "dashboard" ? viewDashboard(q) : v === "claims" ? viewClaims(q) : v === "about" ? viewAbout() : viewRaces(q);
  $app.replaceChildren(...[view].flat(9));
  const navKey = {race: "", c: "", compare: "compare", dashboard: "dashboard", claims: "claims", about: "about"}[v] ?? "";
  document.querySelectorAll("nav a").forEach(n => n.setAttribute("aria-current", n.getAttribute("href") === `#/${navKey}` ? "page" : "false"));
  const title = {race: a && `${a} race`, c: a && C[a] && C[a].name, compare: "Compare", dashboard: "Dashboard", claims: "Search claims", about: "Method"}[v];
  document.title = `${title ? title + " · " : ""}LI-CandidateCheck`;
}
let lastPath = "";
window.addEventListener("hashchange", () => {
  const p = location.hash.split("?")[0];
  render();
  if (p !== lastPath) { window.scrollTo(0, 0); lastPath = p; }
});
render();
</script>
</body>
